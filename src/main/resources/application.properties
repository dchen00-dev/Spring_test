spring.application.name=evaluation
server.port=8081
# =============================================================================
# OracleDB connection settings
# =============================================================================
spring.datasource.url=jdbc:postgresql://postgres-db:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.output.ansi.enabled=ALWAYS



spring.jpa.database=default
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.synonyms=true

# =============================================================================
# LOGGER
# =============================================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=DEBUG
logging.level.org.hibernate.orm.results.graph=INFO
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.jdbc.datasource.init.ScriptUtils=DEBUG

